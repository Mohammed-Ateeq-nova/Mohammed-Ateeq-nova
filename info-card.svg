<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 212" 
     width="490" height="212">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="490" height="212" 
        rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="490" height="36" 
        rx="8" ry="0" fill="#161b22"/>
  <rect x="0" y="36" width="490" height="176" 
        fill="#161b22" />
  <!-- Traffic lights -->
  <circle cx="14" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="32" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="50" cy="18" r="6" fill="#28ca42"/>
  <text x="70" y="24" font-family="SF Mono", "Fira Code", "Monospace" font-size="11" fill="#8b949e">
    Mohammed Ateeq@github
  </text>
  <style>
    .label { font-family: "SF Mono", "Fira Code", "Monospace"; font-size: 11px; fill: #8b949e; font-weight: 600; }
    .value { font-family: "SF Mono", "Fira Code", "Monospace"; font-size: 11px; }
    .bold { font-weight: 600; }
  </style>
  <text x="16" y="52" class="value bold" style="fill="#e6edf3;" opacity:0" transform="translate(8, 0)">Mohammed Ateeq @ Mohammed-Ateeq-nova  <animate attributeName="opacity" from="0" to="1" begin="0ms" dur="400ms" fill="freeze"/>  <animate attributeName="transform" from="translate(8, 0)" to="translate(0, 0)" begin="0ms" dur="400ms" fill="freeze"/></text>
  <text x="16" y="72" class="value bold" style="fill="#58a6ff;" opacity:0" transform="translate(8, 0)">Software Engineer  <animate attributeName="opacity" from="0" to="1" begin="120ms" dur="400ms" fill="freeze"/>  <animate attributeName="transform" from="translate(8, 0)" to="translate(0, 0)" begin="120ms" dur="400ms" fill="freeze"/></text>
  <text x="16" y="92" class="value" style="fill="#8b949e;" opacity:0" transform="translate(8, 0)">Earth  <animate attributeName="opacity" from="0" to="1" begin="240ms" dur="400ms" fill="freeze"/>  <animate attributeName="transform" from="translate(8, 0)" to="translate(0, 0)" begin="240ms" dur="400ms" fill="freeze"/></text>
  <text x="16" y="122" class="label" style="opacity:0" transform="translate(8, 0)">Now  <animate attributeName="opacity" from="0" to="1" begin="480ms" dur="400ms" fill="freeze"/>  <animate attributeName="transform" from="translate(8, 0)" to="translate(0, 0)" begin="480ms" dur="400ms" fill="freeze"/></text>
  <text x="43.5" y="122" class="value" style="fill="#3fb950;" opacity:0" transform="translate(8, 0)">Building things that matter  <animate attributeName="opacity" from="0" to="1" begin="480ms" dur="400ms" fill="freeze"/>  <animate attributeName="transform" from="translate(8, 0)" to="translate(0, 0)" begin="480ms" dur="400ms" fill="freeze"/></text>
  <text x="16" y="142" class="label" style="opacity:0" transform="translate(8, 0)">Prev  <animate attributeName="opacity" from="0" to="1" begin="600ms" dur="400ms" fill="freeze"/>  <animate attributeName="transform" from="translate(8, 0)" to="translate(0, 0)" begin="600ms" dur="400ms" fill="freeze"/></text>
  <text x="50.0" y="142" class="value" style="fill="#8b949e;" opacity:0" transform="translate(8, 0)">Full-stack development • Cloud infrastructure • Open source  <animate attributeName="opacity" from="0" to="1" begin="600ms" dur="400ms" fill="freeze"/>  <animate attributeName="transform" from="translate(8, 0)" to="translate(0, 0)" begin="600ms" dur="400ms" fill="freeze"/></text>
  <text x="16" y="172" class="label" style="opacity:0" transform="translate(8, 0)">Stack  <animate attributeName="opacity" from="0" to="1" begin="840ms" dur="400ms" fill="freeze"/>  <animate attributeName="transform" from="translate(8, 0)" to="translate(0, 0)" begin="840ms" dur="400ms" fill="freeze"/></text>
  <text x="56.5" y="172" class="value" style="fill="#e6edf3;" opacity:0" transform="translate(8, 0)">Python, TypeScript, Go, Rust, C++, Docker, Kubernetes, AWS, PostgreSQL, Redis  <animate attributeName="opacity" from="0" to="1" begin="840ms" dur="400ms" fill="freeze"/>  <animate attributeName="transform" from="translate(8, 0)" to="translate(0, 0)" begin="840ms" dur="400ms" fill="freeze"/></text>
  <text x="16" y="202" class="label" style="opacity:0" transform="translate(8, 0)">Highlights  <animate attributeName="opacity" from="0" to="1" begin="1080ms" dur="400ms" fill="freeze"/>  <animate attributeName="transform" from="translate(8, 0)" to="translate(0, 0)" begin="1080ms" dur="400ms" fill="freeze"/></text>
  <text x="89.0" y="202" class="value" style="fill="#d29922;" opacity:0" transform="translate(8, 0)">100+ GitHub stars • 50+ repos • Open source contributor • Mentor  <animate attributeName="opacity" from="0" to="1" begin="1080ms" dur="400ms" fill="freeze"/>  <animate attributeName="transform" from="translate(8, 0)" to="translate(0, 0)" begin="1080ms" dur="400ms" fill="freeze"/></text>
</svg>